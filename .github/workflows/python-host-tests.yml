name: S3 Python host tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'code.py'
      - 'patterns.py'
      - '.github/workflows/python-host-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'code.py'
      - 'patterns.py'
      - '.github/workflows/python-host-tests.yml'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile firmware and tests
        run: python -m compileall -q src tests code.py patterns.py
      - name: Run complete host regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
