name: Round UI visual snapshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/display/**'
      - 'tools/render_round_ui.py'
      - '.github/workflows/round-ui-visuals.yml'
jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-host-tools.txt
      - run: python tools/generate_hud_bezels.py
      - run: python tools/render_round_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: round-ui-snapshots
          path: reports/round-ui/*.png
          retention-days: 30
